<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePro Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <nav class="top-nav">
        <div class="logo"><i class="fa-solid fa-chart-line"></i> TradePro</div>
        <div class="top-nav-links">
            <a href="#" class="active">Trading</a><a href="#">AI Signals</a><a href="#">My Trades</a><a href="#">Wallet</a><a href="#">Profile</a><a href="#">Settings</a>
        </div>
        <div class="user-controls">
            <div class="account-info">
                <div>Demo Account <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i></div>
                <div class="balance" id="accountBalance">$1,000.00</div>
            </div>
            <button class="btn-reset" id="btnReset">Reset</button>
            <button class="btn-deposit" id="btnDeposit">Deposit</button>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <a href="#" class="nav-item active"><i class="fa-solid fa-chart-simple"></i><span>Trading</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-robot"></i><span>AI Signals</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>My Trades</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
        </aside>

        <main class="workspace">
            <div class="asset-tabs">
                <div class="asset-tab active" data-asset="EUR/USD"><img src="https://flagcdn.com/w20/eu.png" class="asset-flag"> EUR/USD <span class="asset-change up">82%</span><i class="fa-solid fa-xmark tab-close"></i></div>
                <div class="asset-tab" data-asset="GBP/USD"><img src="https://flagcdn.com/w20/gb.png" class="asset-flag"> GBP/USD <span class="asset-change up">82%</span><i class="fa-solid fa-xmark tab-close"></i></div>
                <div class="asset-tab" data-asset="BTC/USD"><i class="fa-brands fa-bitcoin" style="color: #F7931A; font-size: 16px;"></i> BTC/USD <span class="asset-change up">78%</span><i class="fa-solid fa-xmark tab-close"></i></div>
                <div class="asset-tab" data-asset="XAU/USD"><i class="fa-solid fa-coins" style="color: #FFD700; font-size: 14px;"></i> XAU/USD <span class="asset-change up">80%</span><i class="fa-solid fa-xmark tab-close"></i></div>
            </div>

            <div class="main-grid">
                <div class="chart-panel">
                    <div class="chart-header">
                        <div class="chart-info">
                            <img src="https://flagcdn.com/w20/eu.png" class="asset-flag" id="headerFlag">
                            <h2 id="headerAsset">EUR/USD <i class="fa-solid fa-chevron-down" style="font-size:12px;"></i></h2>
                            <span class="badge-green">82%</span>
                        </div>
                        <div class="chart-info" style="color: var(--text-muted); font-size: 13px;">
                            <span>5m <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i></span>
                        </div>
                    </div>
                    <!-- Explicit height on the chart container -->
                    <div class="chart-area" style="height: 400px; position: relative;">
                        <div id="tvChart" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
                        <div class="signal-bubble"><i class="fa-solid fa-robot"></i> AI Signal<br>CALL</div>
                        <div class="trade-controls">
                            <div><label>Amount</label><div class="input-group"><button>-</button><input type="text" value="$ 50"><button>+</button></div></div>
                            <div><label>Time</label><div class="input-group"><input type="text" value="16:40"></div></div>
                            <div class="payout-info"><div class="percent">82%</div><div class="amount">+$91.00</div></div>
                            <button class="btn-trade btn-call" id="btnCall">Call</button>
                            <button class="btn-trade btn-put" id="btnPut">Put</button>
                        </div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="panel-box ai-signal-card">
                        <div class="ai-header"><span><i class="fa-solid fa-robot"></i> AI Signal Bot</span></div>
                        <div class="signal-direction" style="text-align:center; font-size:20px; color:var(--accent-green); font-weight:700; margin:10px 0;">CALL</div>
                        <button class="btn-view-details">New Signal</button>
                    </div>
                    <div class="chat-log" id="chatLog"></div>
                    <div class="ai-chat-input">
                        <input type="text" placeholder="Ask AI..." id="chatInput">
                        <button id="chatSend"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <div class="bottom-panel">
                <div class="trades-table-container">
                    <div class="tabs-header">
                        <button class="tab-btn active">Open Trades</button>
                        <button class="tab-btn">History</button>
                    </div>
                    <table>
                        <thead id="tableHead"><tr><th>Asset</th><th>Type</th><th>Amount</th><th>Open</th><th>Current</th><th>Status</th></tr></thead>
                        <tbody id="tradesBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
