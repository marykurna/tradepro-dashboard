<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePro Dashboard</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Our Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================================
         TOP NAVIGATION
         ================================ -->
    <nav class="top-nav">
        <div class="logo">
            <i class="fa-solid fa-chart-line"></i> TradePro
        </div>
        <div class="top-nav-links">
            <a href="#" class="active">Trading</a>
            <a href="#">AI Signals</a>
            <a href="#">My Trades</a>
            <a href="#">Wallet</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
        </div>
        <div class="user-controls">
            <div class="account-info">
                <div>Demo Account <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i></div>
                <div class="balance">$1,000.00</div>
            </div>
            <button class="btn-deposit">Deposit</button>
        </div>
    </nav>

    <!-- ================================
         MAIN APP CONTAINER
         ================================ -->
    <div class="app-container">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-chart-simple"></i>
                <span>Trading</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-robot"></i>
                <span>AI Signals</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>My Trades</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-wallet"></i>
                <span>Wallet</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </aside>

        <!-- MAIN WORKSPACE -->
                <!-- MAIN WORKSPACE -->
        <main class="workspace">

            <!-- ================================
                 ASSET TABS ROW
                 ================================ -->
            <div class="asset-tabs">
                <div class="asset-tab active">
                    <img src="https://flagcdn.com/w20/eu.png" class="asset-flag" alt="EU">
                    <span>EUR/USD</span>
                    <span class="asset-change up">82%</span>
                    <i class="fa-solid fa-xmark tab-close"></i>
                </div>

                <div class="asset-tab">
                    <img src="https://flagcdn.com/w20/gb.png" class="asset-flag" alt="GB">
                    <span>GBP/USD</span>
                    <span class="asset-change up">82%</span>
                    <i class="fa-solid fa-xmark tab-close"></i>
                </div>

                <div class="asset-tab">
                    <i class="fa-brands fa-bitcoin" style="color: #F7931A; font-size: 16px;"></i>
                    <span>BTC/USD</span>
                    <span class="asset-change up">78%</span>
                    <i class="fa-solid fa-xmark tab-close"></i>
                </div>

                <div class="asset-tab">
                    <i class="fa-solid fa-coins" style="color: #FFD700; font-size: 14px;"></i>
                    <span>XAU/USD</span>
                    <span class="asset-change up">80%</span>
                    <i class="fa-solid fa-xmark tab-close"></i>
                </div>

                <div class="asset-tab">
                    <img src="https://flagcdn.com/w20/us.png" class="asset-flag" alt="US">
                    <span>USD/JPY</span>
                    <span class="asset-change up">79%</span>
                    <i class="fa-solid fa-xmark tab-close"></i>
                </div>

                <button class="btn-add" title="Add asset">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

                        <!-- ================================
                 CHART PANEL + TRADE CONTROLS
                 ================================ -->
            <div class="main-grid">

                <!-- Chart Panel -->
                <div class="chart-panel">
                    <div class="chart-header">
                        <div class="chart-info">
                            <img src="https://flagcdn.com/w20/eu.png" class="asset-flag" alt="EU">
                            <h2>EUR/USD <i class="fa-solid fa-chevron-down" style="font-size:12px;"></i></h2>
                            <span class="badge-green">82%</span>
                        </div>
                        <div class="chart-info" style="color: var(--text-muted); font-size: 13px;">
                            <span>5m <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i></span>
                            <i class="fa-solid fa-chart-line"></i>
                            <i class="fa-solid fa-expand"></i>
                        </div>
                    </div>

                    <!-- Chart Area -->
                    <div class="chart-area">
                        <!-- Price Marker -->
                        <div class="price-marker">1.09732</div>

                        <!-- AI Signal Bubble -->
                        <div class="signal-bubble">
                            <i class="fa-solid fa-robot"></i> AI Signal
                            <br>CALL
                        </div>

                        <!-- SVG Chart -->
                        <svg class="chart-svg" viewBox="0 0 1000 400" preserveAspectRatio="none">
                            <path d="M 0 300 Q 150 350, 300 250 T 600 200 T 900 150" class="chart-line-ma" />
                            <path d="M 0 350 Q 100 380, 200 280 T 400 320 T 600 200 T 800 180 T 1000 100" class="chart-line-price" />

                            <!-- Green candles -->
                            <rect x="50" y="320" width="10" height="30" fill="#00C076" />
                            <rect x="150" y="280" width="10" height="40" fill="#00C076" />
                            <rect x="300" y="300" width="10" height="20" fill="#00C076" />
                            <rect x="500" y="220" width="10" height="50" fill="#00C076" />
                            <rect x="700" y="180" width="10" height="40" fill="#00C076" />
                            <rect x="850" y="140" width="10" height="30" fill="#00C076" />

                            <!-- Red candles -->
                            <rect x="100" y="300" width="10" height="40" fill="#FF3B30" />
                            <rect x="200" y="260" width="10" height="50" fill="#FF3B30" />
                            <rect x="400" y="280" width="10" height="30" fill="#FF3B30" />
                            <rect x="600" y="200" width="10" height="40" fill="#FF3B30" />
                            <rect x="750" y="170" width="10" height="20" fill="#FF3B30" />
                        </svg>

                        <!-- Trade Controls Overlay -->
                        <div class="trade-controls">
                            <div>
                                <label style="font-size: 12px; color: var(--text-muted);">Amount</label>
                                <div class="input-group" style="margin-top: 5px;">
                                    <button><i class="fa-solid fa-minus"></i></button>
                                    <input type="text" value="$ 50">
                                    <button><i class="fa-solid fa-plus"></i></button>
                                </div>
                            </div>

                            <div>
                                <label style="font-size: 12px; color: var(--text-muted);">Time</label>
                                <div class="input-group" style="margin-top: 5px;">
                                    <input type="text" value="16:40">
                                    <button><i class="fa-solid fa-chevron-down"></i></button>
                                </div>
                            </div>

                            <div class="payout-info">
                                <div class="percent">82%</div>
                                <div class="amount">+$91.00</div>
                            </div>

                            <button class="btn-trade btn-call">
                                <i class="fa-solid fa-arrow-up"></i> Call
                            </button>
                            <button class="btn-trade btn-put">
                                <i class="fa-solid fa-arrow-down"></i> Put
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>

    </div>

    <!-- Our Script -->
    <script src="script.js"></script>
</body>
</html>
